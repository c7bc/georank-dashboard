server {
    listen 80;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve Vite SPA at /dashboard/
    # Vite is built with base: '/dashboard/'
    location /dashboard/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Handle assets with long-term caching
    location /dashboard/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect /dashboard (no slash) to /dashboard/
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Health check for the container itself
    location /health {
        return 200 'ok';
    }

    # Deny everything else
    location / {
        return 404;
    }
}
